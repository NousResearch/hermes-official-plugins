name: tests

# Every plugin in this repo, against current Hermes core, on Linux, macOS and Windows.
# The nightly run catches a core change that breaks a plugin before a user does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # A plugin is any top-level directory with a plugin.yaml or plugin.json. Every plugin is validated;
        # pytest runs only where the plugin ships a tests/ dir (portable MCP + skill packages have none).
        run: |
          plugins=$(for d in */; do d=${d%/}; { [ -f "$d/plugin.yaml" ] || [ -f "$d/plugin.json" ]; } && echo "$d"; done | jq -R . | jq -sc .)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "Plugins: $plugins"

  pytest:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.plugin }} · ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: pantheon
      # Plugins import Hermes core (gateway, agent, tools) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes core gates its runtime dependencies on python_version >= '3.14'.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent and the plugin's dependencies
        shell: bash
        # Through uv with core's [tool.uv] override-dependencies, the way Hermes installs itself: core overrides
        # vendor pins that would hold a dependency back (browser-harness's pillow==12.3.0 vs core's Pillow
        # 13.0.0), which plain pip cannot resolve. Plugin dependencies get the same overrides, as in Hermes.
        run: |
          python -m pip install uv
          python -c 'import sys,tomllib; print("\n".join(tomllib.load(open(sys.argv[1], "rb")).get("tool", {}).get("uv", {}).get("override-dependencies", [])))' hermes-agent/pyproject.toml > "$RUNNER_TEMP/core-overrides.txt"
          pyexe=$(python -c 'import sys; print(sys.executable)')
          python -m uv pip install --python "$pyexe" --override "$RUNNER_TEMP/core-overrides.txt" -e ./hermes-agent pytest pytest-asyncio
          deps=$(python -c 'import pathlib,sys,tomllib; p=pathlib.Path(sys.argv[1]); print("\n".join(tomllib.loads(p.read_text())["project"].get("dependencies", [])) if p.is_file() else "")' "pantheon/${{ matrix.plugin }}/pyproject.toml")
          if [ -n "$deps" ]; then printf '%s\n' "$deps" > "$RUNNER_TEMP/plugin-reqs.txt"; python -m uv pip install --python "$pyexe" --override "$RUNNER_TEMP/core-overrides.txt" -r "$RUNNER_TEMP/plugin-reqs.txt"; fi
      - name: Validate the manifest against core
        shell: bash
        run: python -m hermes_cli.main plugins validate "pantheon/${{ matrix.plugin }}"
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Run the plugin suite
        if: hashFiles(format('pantheon/{0}/tests/**', matrix.plugin)) != ''
        working-directory: pantheon/${{ matrix.plugin }}
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
      # A plugin can ship evals/ci.sh for checks beyond its unit suite (e.g. against a real vendor binary, offline).
      - name: Run the plugin's CI evals
        if: runner.os != 'Windows' && hashFiles(format('pantheon/{0}/evals/ci.sh', matrix.plugin)) != ''
        working-directory: pantheon/${{ matrix.plugin }}
        shell: bash
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: bash evals/ci.sh
