name: tests

# Every plugin in this repo, against current Hermes core, on Linux, macOS and Windows.
# The nightly run catches a core change that breaks a plugin before a user does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # A plugin is any top-level directory with a plugin.yaml or plugin.json. Every plugin is validated;
        # pytest runs only where the plugin ships a tests/ dir (portable MCP + skill packages have none).
        run: |
          plugins=$(for d in */; do d=${d%/}; { [ -f "$d/plugin.yaml" ] || [ -f "$d/plugin.json" ]; } && echo "$d"; done | jq -R . | jq -sc .)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "Plugins: $plugins"

  # Hermes' own install-time scanner over every plugin, with the scanner from core main AND from the
  # latest release (what users run today). Anything but `safe` fails: `dangerous` blocks installs,
  # and `caution` blocks catalog re-pins on older releases. Fix real issues in the plugin and false
  # positives in hermes-agent tools/plugin_guard.py. The scanner is stdlib-only, so there's no pip install.
  scan:
    needs: discover
    runs-on: ubuntu-latest
    name: install scanner
    steps:
      - uses: actions/checkout@v4
        with:
          path: pantheon
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: core-main
      - name: Check out the latest Hermes release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo NousResearch/hermes-agent --json tagName -q .tagName)
          echo "Latest release: $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          git clone --quiet --depth 1 --branch "$tag" https://github.com/NousResearch/hermes-agent.git core-release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Scan with the scanner from core main
        working-directory: pantheon
        env:
          PYTHONPATH: ${{ github.workspace }}/core-main
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python .github/scripts/scan_plugins.py "core main" $(echo '${{ needs.discover.outputs.plugins }}' | jq -r '.[]')
      - name: Scan with the scanner from the latest release
        if: always()
        working-directory: pantheon
        env:
          PYTHONPATH: ${{ github.workspace }}/core-release
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python .github/scripts/scan_plugins.py "$RELEASE_TAG" $(echo '${{ needs.discover.outputs.plugins }}' | jq -r '.[]')

  pytest:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.plugin }} · ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: pantheon
      # Plugins import Hermes core (gateway, agent, tools) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes core gates its runtime dependencies on python_version >= '3.14'.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent and the plugin's dependencies
        shell: bash
        run: |
          python -m pip install -e ./hermes-agent pytest pytest-asyncio
          deps=$(python -c 'import pathlib,sys,tomllib; p=pathlib.Path(sys.argv[1]); print("\n".join(tomllib.loads(p.read_text())["project"].get("dependencies", [])) if p.is_file() else "")' "pantheon/${{ matrix.plugin }}/pyproject.toml")
          if [ -n "$deps" ]; then printf '%s\n' "$deps" > "$RUNNER_TEMP/plugin-reqs.txt"; python -m pip install -r "$RUNNER_TEMP/plugin-reqs.txt"; fi
      - name: Validate the manifest against core
        shell: bash
        run: python -m hermes_cli.main plugins validate "pantheon/${{ matrix.plugin }}"
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Run the plugin suite
        if: hashFiles(format('pantheon/{0}/tests/**', matrix.plugin)) != ''
        working-directory: pantheon/${{ matrix.plugin }}
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
      # A plugin can ship evals/ci.sh for checks beyond its unit suite (e.g. against a real vendor binary, offline).
      - name: Run the plugin's CI evals
        if: runner.os != 'Windows' && hashFiles(format('pantheon/{0}/evals/ci.sh', matrix.plugin)) != ''
        working-directory: pantheon/${{ matrix.plugin }}
        shell: bash
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: bash evals/ci.sh
