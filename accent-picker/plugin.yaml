name: accent-picker
label: Accent Picker
version: 1.1.0
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/accent-picker
description: >
  OKLCH accent picker and theme authoring for the Hermes Desktop status bar.
  Every palette slot (sidebar, card, popover, ...) is editable from surface
  squares that glow over the region they repaint on hover; per-slot and
  whole-theme copy/paste; themes can be saved, exported and imported as JSON;
  a Glass tab tunes window transparency (glass/clear, intensity, fade,
  material, scope). Desktop-only (desktop/plugin.js); no agent tools.
tags: [desktop, theme, appearance]
