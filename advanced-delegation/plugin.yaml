name: advanced-delegation
label: Advanced Delegation
kind: standalone
version: 1.0.0
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/advanced-delegation
description: >
  Two extra delegation modes for delegate_task. Model routes
  (delegation.backend: model_map): the agent picks a named model route per
  subagent from a list you define. Profile routes
  (delegation.backend: profile_routes): the agent runs a subagent as one of
  your Hermes profiles. Set up with `hermes delegation config`; switch modes
  in a chat with /delegation. Only route names and descriptions reach the
  model. Needs a Hermes core with pluggable delegation providers.
requires_hermes: ">=0.22.5"
provides_tools: []
provides_hooks: []
