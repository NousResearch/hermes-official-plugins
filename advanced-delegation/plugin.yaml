name: advanced-delegation
label: Advanced Delegation
kind: standalone
version: 1.2.1
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/advanced-delegation
description: >
  Two extra delegation modes for delegate_task plus optional System-1 Decider
  auto-routing. Model routes (delegation.backend: model_map): the agent picks a
  named model route per subagent from a list you define, or lets a local/cloud
  System-1 Decider (/v1/systemone) auto-route unassigned tasks in a single batch.
  Profile routes (delegation.backend: profile_routes): the agent runs a subagent
  as one of your Hermes profiles. Set up with `hermes delegation config` or
  `hermes delegation decider`; switch modes in a chat with /delegation.
requires_hermes: ">=0.22.5"
provides_tools: []
provides_hooks:
  - pre_tool_call
