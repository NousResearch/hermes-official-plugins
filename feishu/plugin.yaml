name: feishu
label: Feishu / Lark
kind: platform
version: 2.0.0
# The first Hermes release without core's bundled Feishu (its built-in feishu_* tools reject this plugin's).
requires_hermes: ">=0.23.5"
description: >
  Feishu / Lark gateway adapter for Hermes Agent. Connects to Feishu (China) or Lark
  (International) via the official lark-oapi SDK over WebSocket or webhook and
  relays messages between Feishu/Lark chats and the Hermes agent. Supports text,
  images, video, voice, documents, threads, DM pairing, group @mention gating,
  drive comment events, and meeting invites. The feishu_doc / feishu_drive
  toolsets (feishu_doc_read, feishu_drive_list_comments,
  feishu_drive_list_comment_replies, feishu_drive_reply_comment,
  feishu_drive_add_comment) read documents and answer document comments; they are
  offered only once FEISHU_APP_ID and FEISHU_APP_SECRET (or platforms.feishu
  app_id / app_secret) are set for the profile. Installed by default on every
  Hermes home, idle until configured. Formerly built into Hermes core.
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/feishu
provides_tools:
  - feishu_doc_read
  - feishu_drive_list_comments
  - feishu_drive_list_comment_replies
  - feishu_drive_reply_comment
  - feishu_drive_add_comment
provides_hooks: []
requires_env:
  - name: FEISHU_APP_ID
    description: "Feishu/Lark app ID"
    prompt: "Feishu App ID"
    url: "https://open.feishu.cn/"
    password: false
  - name: FEISHU_APP_SECRET
    description: "Feishu/Lark app secret"
    prompt: "Feishu App Secret"
    url: "https://open.feishu.cn/"
    password: true
optional_env:
  - name: FEISHU_DOMAIN
    description: "Domain: 'feishu' (China) or 'lark' (International)"
    prompt: "Domain (feishu/lark)"
    password: false
  - name: FEISHU_ALLOWED_USERS
    description: "Comma-separated Feishu user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: FEISHU_ALLOW_ALL_USERS
    description: "Allow any Feishu user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: FEISHU_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: FEISHU_HOME_CHANNEL_NAME
    description: "Display name for the Feishu home channel"
    prompt: "Home channel display name"
    password: false
