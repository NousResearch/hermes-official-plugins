name: hermes-mobile-device-access
version: "1.7.2"
manifest_version: 2
requires_hermes: ">=0.21.5"
provides_tools: [mobile_devices, mobile_request_result, mobile_calendar_events, mobile_calendar_create, mobile_reminders_list, mobile_reminder_create, mobile_reminder_complete, mobile_reminder_update, mobile_health_summary, mobile_health_log, mobile_location, mobile_contacts_search, mobile_alarms_list, mobile_alarm_create, mobile_timer_start, mobile_alarm_cancel]
provides_hooks: []
optional_env:
  - name: HERMES_MOBILE_PUSH_RELAY_URL
    description: Relay URL for device wake requests
  - name: HERMES_MOBILE_PUSH_INSTALL_KEY
    description: Install key for device wake requests
    password: true
description: "Use permitted Calendar, Reminders (read, create, edit), Health (read and log), Contacts, location, alarms and timers from a paired Hermes Agent device."
author: Hermes Agent
