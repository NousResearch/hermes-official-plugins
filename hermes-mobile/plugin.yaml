name: hermes-mobile
label: Hermes Mobile
kind: platform
version: "2.0.0"
manifest_version: 2
requires_hermes: ">=0.21.5"
provides_tools:
  - mobile_devices
  - mobile_request_result
  - mobile_calendar_events
  - mobile_calendar_create
  - mobile_reminders_list
  - mobile_reminder_create
  - mobile_reminder_complete
  - mobile_reminder_update
  - mobile_health_summary
  - mobile_health_log
  - mobile_location
  - mobile_contacts_search
  - mobile_alarms_list
  - mobile_alarm_create
  - mobile_timer_start
  - mobile_alarm_cancel
provides_hooks:
  - pre_approval_request
  - pre_api_request
  - post_llm_call
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - on_stream_start
  - post_approval_response
  - on_human_input_request
  - on_human_input_resolved
  - on_session_prompt
  - on_session_prompt_settled
python_dependencies:
  - "cryptography>=50,<51"
description: "Push notifications (APNs and FCM through a push relay, with encrypted previews and Live Activity snapshots) and paired mobile device capabilities (Calendar, Reminders, Health, Contacts, location, alarms and timers) for the Hermes Agent mobile apps."
author: Hermes Agent
optional_env:
  - name: HERMES_MOBILE_PUSH_RELAY_URL
    description: "Base URL of the push relay notifications and device wake requests are posted to"
    prompt: "Relay URL"
    password: false
  - name: HERMES_MOBILE_PUSH_INSTALL_KEY
    description: "Install key pairing this Hermes install with your devices (generated by the mobile app)"
    prompt: "Install key"
    password: true
