openapi: 3.1.0
info:
  title: hermes-mobile-push dashboard API
  version: "1"
  description: >
    The routes `dashboard/plugin_api.py` mounts under `/api/plugins/hermes-mobile-push`, as the Hermes Agent app
    calls them. Read-only: they report on a profile's sessions and change nothing. An error answers
    `{"detail": <reason>}`.
paths:
  /api/plugins/hermes-mobile-push/sessions/silent:
    get:
      summary: >
        The profile's newest scheduled and webhook runs (at most 1,000) whose final reply was a
        silence marker such as `[SILENT]`, by Hermes' own rule for autonomous runs.
      parameters:
        - $ref: "#/components/parameters/Profile"
      responses:
        "200":
          description: The silent runs' session ids.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSilentSessions"}
        "400":
          description: The profile name is not a valid profile name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushError"}
        "404":
          description: No such profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushError"}
        "503":
          description: The profile's session store could not be read; try again.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushError"}
components:
  parameters:
    Profile:
      name: profile
      in: query
      description: >
        The profile whose runs to read: `default` or a named profile. Omitted, the route serves the
        profile Hermes binds the request to, else the profile Hermes was launched with.
      schema: {type: string}
  schemas:
    PushError:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    PushSilentSessions:
      type: object
      additionalProperties: false
      required: [silent]
      properties:
        silent:
          type: array
          description: Session ids, newest first.
          items: {type: string}
