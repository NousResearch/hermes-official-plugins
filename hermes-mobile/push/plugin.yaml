name: hermes-mobile-push
label: Push (Hermes Agent)
kind: platform
version: 1.11.0
manifest_version: 2
requires_hermes: ">=0.21.3"
provides_tools: []
provides_hooks: [pre_approval_request, pre_api_request, post_llm_call, on_session_end, pre_tool_call, post_tool_call, on_stream_start, post_approval_response, on_human_input_request, on_human_input_resolved, on_session_prompt, on_session_prompt_settled]
python_dependencies: ["cryptography>=50,<51"]
description: Delivers notifications to the Hermes Agent apps as native push notifications through the push relay (APNs and FCM).
author: Hermes Agent
requires_env:
  - name: HERMES_MOBILE_PUSH_RELAY_URL
    description: "Base URL of the push relay the notifications are posted to"
    prompt: "Relay URL"
    password: false
  - name: HERMES_MOBILE_PUSH_INSTALL_KEY
    description: "Install key pairing this Hermes install with your devices (generated by the Hermes Agent app)"
    prompt: "Install key"
    password: true
