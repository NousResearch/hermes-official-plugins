{
  "name": "hermes-security",
  "label": "Security",
  "version": "0.1.0",
  "description": "Local repository security review with evidence, coverage, and controlled validation.",
  "author": "NousResearch",
  "license": "Apache-2.0",
  "kind": "standalone",
  "manifest_version": 1,
  "requires_hermes": ">=0.21.5",
  "provides_tools": [
    "security_scan_start",
    "security_scan_get",
    "security_scan_checkpoint",
    "security_scan_submit_worker_result",
    "security_scan_record_validations",
    "security_scan_record_chains",
    "security_scan_finalize",
    "security_scan_cancel",
    "security_scan_export"
  ],
  "provides_hooks": [
    "on_session_end",
    "subagent_start",
    "subagent_stop"
  ],
  "homepage": "https://github.com/NousResearch/hermes-official-plugins/tree/main/hermes-security"
}
