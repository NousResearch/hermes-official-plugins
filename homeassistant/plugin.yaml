name: homeassistant
label: Home Assistant
kind: platform
version: 2.0.1
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/homeassistant
description: >
  Home Assistant for Hermes Agent: a gateway platform adapter plus six
  smart-home tools. The adapter subscribes to HA's WebSocket event bus and
  forwards state-change events (with per-entity cooldowns and domain/entity
  filtering) to the agent; replies are delivered as HA persistent
  notifications, and cron deliver=homeassistant goes through the
  target's notify service (notify.<target>). The homeassistant toolset (ha_list_entities,
  ha_get_state, ha_list_services, ha_call_service, ha_list_statistics,
  ha_get_statistics) queries and controls devices over the REST API and
  queries Recorder long-term statistics over the WebSocket API. Formerly built into Hermes core.
requires_hermes: ">=0.21.5"
provides_tools:
  - ha_list_entities
  - ha_get_state
  - ha_list_services
  - ha_call_service
  - ha_list_statistics
  - ha_get_statistics
provides_hooks: []
requires_env:
  - name: HASS_TOKEN
    description: "Home Assistant Long-Lived Access Token"
    prompt: "Home Assistant Long-Lived Access Token"
    password: true
optional_env:
  - name: HASS_URL
    description: "Home Assistant base URL (default: http://homeassistant.local:8123)"
    prompt: "Home Assistant URL"
    password: false
  - name: HASS_HOME_CHANNEL
    description: "Default notify target for cron deliver=homeassistant (e.g. mobile_app_my_phone)"
    prompt: "Home Assistant default notify target"
    password: false
  - name: HASS_ENTITY_DENYLIST
    description: "Comma-separated entity_id prefixes or globs the tools always exclude (final veto): hidden from ha_list_entities, refused by ha_get_state and ha_call_service"
    prompt: "Home Assistant entity denylist (e.g. office_thermostat_*)"
    password: false
  - name: HASS_ENTITY_ALLOWLIST
    description: "Comma-separated entity_id prefixes or globs listing, reading and ha_call_service control are limited to (whitelist; the denylist still vetoes)"
    prompt: "Home Assistant entity allowlist (e.g. climate.*, sensor.office_*)"
    password: false
  - name: HASS_MAX_ENTITIES
    description: "Optional cap on ha_list_entities results (unset = no cap; a per-call max overrides it)"
    prompt: "Home Assistant max entities per list call (empty = no cap)"
    password: false
