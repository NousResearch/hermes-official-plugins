name: mcp-serve
label: MCP Serve
kind: standalone
version: 1.0.0
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/mcp-serve
description: >
  Run Hermes as an MCP server: `hermes mcp-serve` lets any MCP client (Claude
  Code, Claude Desktop, Cursor, Codex) list and read your messaging
  conversations, poll live events, send messages and answer approvals over
  stdio. `--tools` (off by default) also exposes Hermes' web, browser, vision,
  image generation, skills and TTS tools under your profile's credentials;
  terminal, file and kanban tools are never exposed. `--bot-chat` (off by
  default) lets the client message this install's Bot Mode agents and get
  their replies. Formerly built into
  Hermes core as `hermes mcp serve`.
requires_hermes: ">=0.22.0"
provides_tools: []
provides_hooks: []
